<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Muze-X Lab — champ de réflexion public en grille dynamique de points.">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' data:; script-src 'self'; base-uri 'self'; form-action 'self'">
  <title>Champ de réflexion — Muze-X Lab</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="stylesheet" href="./reflection-field.css">
</head>
<body data-portal-exempt="reflection-field">
  <main id="reflection-stage" class="reflection-stage" aria-labelledby="reflection-title">
    <div id="qr-layer" class="qr-layer" aria-hidden="true">
      <canvas id="portal-qr" aria-hidden="true"></canvas>
    </div>
    <canvas id="reflection-field" aria-hidden="true"></canvas>
    <div class="reflection-chrome">
      <h1 id="reflection-title">Réflexion en cours</h1>
      <a class="back-link" href="../" aria-label="Retour à Muze-X Lab">Muze-X Lab</a>
    </div>
    <p class="sr-only">Une grille fixe de points rose et violet varie en taille et en luminosité selon deux champs d’intensité dynamiques. Maintenez une pression au centre de l’écran pour disperser les essaims et révéler un QR code qui renvoie vers la plateforme publique Muze-X Lab.</p>
  </main>
  <script src="./reflection-field.js"></script>
</body>
</html>
