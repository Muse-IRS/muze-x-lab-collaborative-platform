name: Validate public boundary

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required public files
        run: |
          test -f public/index.html
          test -f public/privacy.html
          test -f public/information/index.html
          test -f public/dpe/index.html
          test -f public/dpe/app.js
          test -f public/energy/index.html
          test -f public/energy/app.js
          test -f public/assets/brand-logo.svg
          test -f public/assets/favicon.svg
          test -f public/assets/brand.css
          test -f public/assets/mesh-portal.css
          test -f public/assets/mesh-portal.js
          test -f docs/PORTAL_ATTRACTOR_PROTOCOL.md

      - name: Check JavaScript syntax
        run: |
          node --check public/dpe/app.js
          node --check public/energy/app.js
          node --check public/assets/mesh-portal.js

      - name: Require portal attractor on every public HTML page
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          missing = []
          for path in Path('public').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if 'mesh-portal.css' not in text or 'mesh-portal.js' not in text:
                  missing.append(str(path))
          if missing:
              raise SystemExit('Portal attractor missing from: ' + ', '.join(missing))
          PY

      - name: Enforce public repository boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'github\.com/Muse-IRS|adaptive_closed_loop|adaptive-closed-loop|backtest|research_protocol|systemic_matrix|phase6[a-z]?' public; then
            echo 'Private/research implementation marker found in public artifact.' >&2
            exit 1
          fi

      - name: Enforce autonomous RGPD site boundary
        shell: bash
        run: |
          set -euo pipefail
          if test -d public/rgpd; then
            echo 'RGPD Data Journey Audit must remain an autonomous site, not a subpage of this platform.' >&2
            exit 1
          fi
          if grep -RniE 'href="\.\.?/rgpd/?"|href="\.\.?/rgpd/"|src="\.\.?/rgpd/' public; then
            echo 'Local /rgpd/ route found. Link to the autonomous RGPD site instead.' >&2
            exit 1
          fi

      - name: Reject committed environment files
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '.env' -o -name '.env.local' \) | grep -q .; then
            echo 'Environment secret file must not be committed.' >&2
            exit 1
          fi
